---
# Reflection of https://docs.alfresco.com/content-services/latest/support/
# TO BE ENRICHED AS RELEASES ARE OUT
# * Search Services (`search`) is no longer supported for Enterprise edition starting with ACS v26
patterns:
  # Suffixes concatenated with `version` under `versionFilterKind: regex` (see common_version_filter in uber-manifest.tpl).
  ga: &ga_pattern (\.[0-9]+){1,2}
  ga_with_hotfixes: &ga_hotfixes_pattern (\.[0-9]+){0,3}
  ga_activemq: &ga_activemq_pattern \.\d+-jre17-rockylinux8
  # Full regexes used as `regex` under `versionFilterKind: regex/semver`, to pre-filter tags before the semver constraint applies.
  development: &development_regex '^(\d+(\.[0-9]+){2}(-A\.?[0-9]+)?)$'
  build: &build_regex '^(\d+(\.[0-9]+){2}(-[0-9]+)?)$'
matrix:
  next:
    id: next
    acs: &acs_next_version_spec
      version: ">=26.0.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex # mainly to ignore -Mx
    activemq:
      version: "6.2"
      pattern: *ga_activemq_pattern
    share: *acs_next_version_spec
    search-enterprise:
      version: ">=5.0.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    cic-connector:
      version: ">=1.0.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    sync:
      version: ">=5.3.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    adw:
      version: ">=7.3.0-0"
      versionFilterKind: regex/semver
      regex: *build_regex
    adminApp:
      version: ">=10.3.0-0"
      versionFilterKind: regex/semver
      regex: *build_regex
    onedrive:
      version: ">=2.1.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    msteams:
      version: ">=2.1.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    intelligence:
      version: ">=3.4.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    trouter: &ats_next_version
      version: ">=4.4.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    sfs: *ats_next_version
    tengine-aio: &tengines_next_version
      version:  ">=5.4.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    tengine-misc: *tengines_next_version
    tengine-im: *tengines_next_version
    tengine-lo: *tengines_next_version
    tengine-tika: *tengines_next_version
    tengine-pdf: *tengines_next_version
    pdf-renderer:
      version: ">=1.3.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex
    audit-storage:
      version: ">=1.3.0-0"
      versionFilterKind: regex/semver
      regex: *development_regex

  current:
    id: current
    acs: &acs_ga_version_spec
      version: "~26"
      versionFilterKind: semver
    activemq: &activemq6_ga_version_spec
      version: "6.2"
      pattern: *ga_activemq_pattern
    share: *acs_ga_version_spec
    search-enterprise: &search_ent_ga_version_spec
      version: "~5"
      versionFilterKind: semver
    cic-connector: &cic_connector_ga_version_spec
      version: "~1"
      versionFilterKind: semver
    sync: &sync_ga_version_spec
      version: "~5.3"
      versionFilterKind: semver
    adw: &adw_ga_version_spec
      version: ">=7.3"
      versionFilterKind: semver
    adminApp: &acc_ga_version_spec
      version: ">=10.3"
      versionFilterKind: semver
    onedrive: &onedrive_ga_version_spec
      version: ">=2.1"
      versionFilterKind: semver
    msteams: &msteams_ga_version_spec
      version: ">=2.1"
      versionFilterKind: semver
    intelligence: &ais_ga_version_spec
      version: ">=3.4.0"
      versionFilterKind: semver
    trouter: &ats_ga_version
      version: ">=4.4"
      versionFilterKind: semver
    sfs: *ats_ga_version
    tengine-aio: &tengines_ga_version_spec
      version: ">=5.4"
      versionFilterKind: semver
    tengine-misc: *tengines_ga_version_spec
    tengine-im: *tengines_ga_version_spec
    tengine-lo: *tengines_ga_version_spec
    tengine-tika: *tengines_ga_version_spec
    tengine-pdf: *tengines_ga_version_spec
    pdf-renderer: &pdf_renderer_version
      version: ">=1.3.0-0"
      versionFilterKind: semver
    activiti:
      version: &activiti_ga_version "26"
      pattern: *ga_pattern
    activiti-admin:
      version: *activiti_ga_version
      pattern: *ga_pattern
    audit-storage: &audit_storage_ga_version_spec
      version: ">=1.3"
      versionFilterKind: semver

  25.N:
    id: 25n
    acs: &acs_25_ga_version_spec
      version:  "~25"
      versionFilterKind: semver
    activemq: &activemq5_ga_version_spec
      version: "5.19"
      pattern: *ga_activemq_pattern
    share: *acs_25_ga_version_spec
    search: &search_ga_version_spec
      version: "~2"
      versionFilterKind: semver
    insight-zeppelin: *search_ga_version_spec
    search-enterprise: *search_ent_ga_version_spec
    cic-connector: *cic_connector_ga_version_spec
    sync: *sync_ga_version_spec
    adw: *adw_ga_version_spec
    adminApp: *acc_ga_version_spec
    onedrive: *onedrive_ga_version_spec
    msteams: *msteams_ga_version_spec
    intelligence: *ais_ga_version_spec
    trouter: *ats_ga_version
    sfs: *ats_ga_version
    tengine-aio: *tengines_ga_version_spec
    tengine-misc: *tengines_ga_version_spec
    tengine-im: *tengines_ga_version_spec
    tengine-lo: *tengines_ga_version_spec
    tengine-tika: *tengines_ga_version_spec
    tengine-pdf: *tengines_ga_version_spec
    pdf-renderer: *pdf_renderer_version
    activiti:
      version: &activiti_25_version "25"
      pattern: *ga_pattern
    activiti-admin:
      version: *activiti_25_version
      pattern: *ga_pattern
    audit-storage: *audit_storage_ga_version_spec

  23.N:
    id: 23n
    acs: &acs_23_version_spec
      version: "~23"
      versionFilterKind: semver
    activemq: *activemq5_ga_version_spec
    share: *acs_23_version_spec
    search: *search_ga_version_spec
    insight-zeppelin: *search_ga_version_spec
    search-enterprise: *search_ent_ga_version_spec
    cic-connector: *cic_connector_ga_version_spec
    sync: *sync_ga_version_spec
    adw: *adw_ga_version_spec
    adminApp: *acc_ga_version_spec
    onedrive: *onedrive_ga_version_spec
    msteams: *msteams_ga_version_spec
    intelligence: *ais_ga_version_spec
    trouter: *ats_ga_version
    sfs: *ats_ga_version
    tengine-aio: *tengines_ga_version_spec
    tengine-misc: *tengines_ga_version_spec
    tengine-im: *tengines_ga_version_spec
    tengine-lo: *tengines_ga_version_spec
    tengine-tika: *tengines_ga_version_spec
    tengine-pdf: *tengines_ga_version_spec
    pdf-renderer: *pdf_renderer_version
    activiti:
      version: &activiti_24_version "24"
      pattern: *ga_pattern
    activiti-admin:
      version: *activiti_24_version
      pattern: *ga_pattern
    audit-storage: *audit_storage_ga_version_spec

  community:
    id: com
    acs:
      <<: *acs_ga_version_spec
      image: docker.io/alfresco/alfresco-content-repository-community
    activemq:
      <<: *activemq6_ga_version_spec
      image: docker.io/alfresco/alfresco-activemq
    share:
      <<: *acs_ga_version_spec
      image: docker.io/alfresco/alfresco-share
    batch-indexing:
      version: ">=5.0.0"
      versionFilterKind: semver
      image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing
    adminApp: *acc_ga_version_spec
    tengine-aio: *tengines_ga_version_spec
    pdf-renderer: *pdf_renderer_version
    aca: *adw_ga_version_spec

  community-next:
    id: com-next
    # Same as 'community', except batch-indexing also tracks its "-A.N" development
    # tags, and postgres/elasticsearch (generic test infra, not Alfresco products)
    # are pinned to whatever this repo's test environment currently supports.
    activemq:
      <<: *activemq6_ga_version_spec
      image: docker.io/alfresco/alfresco-activemq
    postgres:
      version: "~17"
      versionFilterKind: semver
      image: postgres
    elasticsearch:
      version: "~8.17"
      versionFilterKind: semver
      image: elasticsearch
    search:
      version: "~2.0"
      versionFilterKind: semver
      image: docker.io/alfresco/alfresco-search-services
    batch-indexing:
      version: ">=5.0.0-0"
      versionFilterKind: regex/semver
      regex: '^(\d+\.\d+\.\d+(?:-A\.?\d+)?)$'
      image: docker.io/alfresco/alfresco-elasticsearch-batch-indexing
